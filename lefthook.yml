# git hooks：pnpm install 时由 lefthook 的 postinstall 自动安装

# 每个 job 结束时打印它的标题和输出，最后是 summary
output:
  - execution
  - execution_out
  - failure
  - summary
# 运行 hook 时不再自动同步安装（postinstall 已经装过）；设了全局 core.hooksPath 时，这一步每次都会打印一大段警告
no_auto_install: true

templates:
  # 加在命令前面：成功时不出声，失败时才打印全部输出
  quiet: sh "$(git rev-parse --show-toplevel)/scripts/quiet.sh"

# 只格式化暂存的文件，格式化后自动重新 git add
pre-commit:
  jobs:
    - name: format
      run: pnpm format --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: format
      run: '{quiet} pnpm format:check'
    - name: go-format
      root: apps/desktop/
      run: |
        unformatted=$(gofmt -l .) || exit $?
        if [ -n "$unformatted" ]; then
          printf 'Go files need formatting:\n%s\n' "$unformatted"
          exit 1
        fi
    - name: lint
      run: '{quiet} pnpm exec eslint .'
    - name: go-lint
      run: '{quiet} pnpm lint:go'
    - name: knip
      run: '{quiet} pnpm knip'
    - name: typecheck
      run: '{quiet} pnpm typecheck'
    - name: test
      run: '{quiet} pnpm test'
