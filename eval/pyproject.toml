[project]
name = "ji-eval"
version = "0.0.0"
description = "Benchmark runs of the JI coding agent through Harbor"
requires-python = ">=3.13"
dependencies = ["harbor==0.24.0"]

[dependency-groups]
dev = ["ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ji_eval"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PTH"]

[tool.ruff.format]
quote-style = "double"
