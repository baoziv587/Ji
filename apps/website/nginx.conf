# Serves the prerendered site in dist/client. Every page is a file, so there is
# no SPA fallback: /docs/plugins is /docs/plugins/index.html, and anything else is 404.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep redirects relative, so they work behind a proxy on another port or host.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Hashed by Vite, so they never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
